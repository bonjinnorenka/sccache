name: rust-toolchain
inputs:
  toolchain:
    description: |
      Rust toolchain name.
      See https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification
    required: false
  target:
    description: Target triple to install for this toolchain
    required: false
  components:
    description: Space-separated list of components to be additionally installed for a new toolchain
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SELECTED_TOOLCHAIN: ${{ inputs.toolchain || 'stable' }}
      run: |
        set -euxo pipefail
        # Runner images may ship different preinstalled stable versions during a rollout.
        if [[ "$SELECTED_TOOLCHAIN" == stable ]]; then
          rustup update stable --no-self-update
        fi
        rustup override set "$SELECTED_TOOLCHAIN"
        ${{ inputs.target && format('rustup target add {0}', inputs.target) }}
        ${{ inputs.components && format('rustup component add {0}', inputs.components) }}
        cargo --version
        rustc --version
