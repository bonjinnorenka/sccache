name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - exp-d-hardening
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  rust-validation:
    name: rust-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable
          components: clippy rustfmt

      - name: Install native tools used by Rust system tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc clang

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check TOML formatting
        run: npx --yes @taplo/cli fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -A unknown-lints -A clippy::type_complexity -A clippy::new-without-default -A clippy::double_must_use -A clippy::nonstandard_macro_braces

      - name: Check supported storage features
        run: |
          cargo check --locked --no-default-features --features s3
          cargo check --locked --no-default-features --features gha
          cargo check --locked --no-default-features --features 's3,gha'

      - name: Run Rust unit and integration tests
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WRAPPER: ''
        run: cargo test --locked --lib --bins --tests

      - name: Build the shared Linux validation binary
        run: cargo build --locked --bin sccache

      - name: Upload the shared Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: sccache-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/sccache
          retention-days: 2
          if-no-files-found: error

  cache-regression:
    name: cache-regression
    needs: rust-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Download the validated Linux binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/

      - name: Run Disk L0 correctness, Cross-root, and dep-info checks
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/disk
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-disk-regression.sh

      - name: Run Silo S3 L1, backfill, and fault-injection checks
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/s3
        run: bash tests/integration/scripts/test-s3-multilevel-regression.sh

      - name: Measure Tokio Small and Medium cache performance
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/performance
        run: bash tests/integration/scripts/test-performance-regression.sh

      - name: Upload cache regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/
          retention-days: 14
          if-no-files-found: ignore

  ghac-seed:
    name: ghac-seed
    needs: rust-validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Download the validated Linux binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/

      - name: Export GHAC runtime environment
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[key]) core.exportVariable(key, process.env[key]);
            }
            const v2 = process.env.ACTIONS_CACHE_SERVICE_V2 || (process.env.ACTIONS_RESULTS_URL ? 'true' : '');
            if (v2) core.exportVariable('ACTIONS_CACHE_SERVICE_V2', v2);

      - name: Seed GHAC from this job
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          SCCACHE_GHA_ENABLED: 'on'
          SCCACHE_GHA_VERSION: reg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/ghac-seed
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-ghac-regression.sh \
            --role seed \
            --meta-file "$REPORT_DIR/seed-meta.json"

      - name: Upload seed metadata and sanitized report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghac-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/ghac-seed/
          retention-days: 5
          if-no-files-found: ignore

  ghac-verify:
    name: ghac-verify
    needs: [rust-validation, ghac-seed]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require a trusted run with a successful seed
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          RUST_VALIDATION_RESULT: ${{ needs.rust-validation.result }}
          GHAC_SEED_RESULT: ${{ needs.ghac-seed.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "GHAC was not run: fork PRs do not receive cache write credentials. A maintainer must run this workflow on a trusted branch before merge."
            exit 1
          fi
          [[ "$RUST_VALIDATION_RESULT" == success ]] || { echo "Rust validation did not pass"; exit 1; }
          [[ "$GHAC_SEED_RESULT" == success ]] || { echo "GHAC seed did not pass"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Download the validated Linux binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/

      - name: Download seed metadata only
        uses: actions/download-artifact@v8
        with:
          name: ghac-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/ghac-seed/

      - name: Export GHAC runtime environment
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[key]) core.exportVariable(key, process.env[key]);
            }
            const v2 = process.env.ACTIONS_CACHE_SERVICE_V2 || (process.env.ACTIONS_RESULTS_URL ? 'true' : '');
            if (v2) core.exportVariable('ACTIONS_CACHE_SERVICE_V2', v2);

      - name: Verify cross-job GHAC hit, Cross-root reuse, and L0 backfill
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          SCCACHE_GHA_ENABLED: 'on'
          SCCACHE_GHA_VERSION: reg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/ghac
        run: |
          mkdir -p "$REPORT_DIR"
          chmod +x "$SCCACHE_BIN"
          cp target/regression-reports/ghac-seed/leg_ghac_seed.json "$REPORT_DIR/"
          bash tests/integration/scripts/test-ghac-regression.sh \
            --role verify \
            --meta-file target/regression-reports/ghac-seed/seed-meta.json

      - name: Upload GHAC verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghac-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/ghac/
          retention-days: 14
          if-no-files-found: ignore

  rust-beta-compatibility:
    name: rust-beta-compatibility
    needs: rust-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust beta
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: beta

      - name: Install stable for compiler-key isolation
        run: rustup toolchain install --profile minimal --no-self-update stable

      - name: Download the validated Linux binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/

      - name: Check Rust cache compatibility with beta
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/compat-beta
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-rust-compatibility.sh --toolchain beta --alt-toolchain stable

      - name: Upload beta compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-beta-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/compat-beta/
          retention-days: 14
          if-no-files-found: ignore

  linux-release-smoke:
    name: linux-release-smoke
    needs: rust-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable and musl tools
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Install musl target and linker
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build the Linux x86_64 musl release binary
        run: cargo build --locked --release --bin sccache --target x86_64-unknown-linux-musl --features openssl/vendored

      - name: Smoke test the release binary and Rust compilation
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/release-smoke
        run: |
          chmod +x "$SCCACHE_BIN"
          "$SCCACHE_BIN" --version
          bash tests/integration/scripts/test-disk-regression.sh

      - name: Package the verified binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${GITHUB_SHA::12}}"
          package="sccache-${version}-x86_64-unknown-linux-musl"
          mkdir -p "release-package/$package"
          cp target/x86_64-unknown-linux-musl/release/sccache README.md LICENSE "release-package/$package/"
          tar -C release-package -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: sccache-release-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sccache-*.tar.gz
            sccache-*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: publish-linux-release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - rust-validation
      - cache-regression
      - ghac-seed
      - ghac-verify
      - rust-beta-compatibility
      - linux-release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag, commit, and package version
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download verified Linux x86_64 package
        uses: actions/download-artifact@v8
        with:
          name: sccache-release-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish verified Linux x86_64 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sccache-*.tar.gz sccache-*.tar.gz.sha256 --verify-tag --title "$GITHUB_REF_NAME" --notes "Verified Ubuntu Linux x86_64 musl release."
