name: regression

on:
  push:
    branches:
      - main
      - exp-d-hardening
  pull_request:
  schedule:
    # Weekly Monday 03:17 UTC to catch upstream Rust/Cargo toolchain changes cleanly.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  sccache-rust-correctness:
    name: sccache-rust-correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Build sccache binary
        run: cargo build --locked --bin sccache

      - name: Run unit and Rust correctness tests
        id: tests
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          mkdir -p target/regression-reports/correctness

          t0=$(python3 -c 'import time; print(time.monotonic())')
          cargo test --locked --lib
          t1=$(python3 -c 'import time; print(time.monotonic())')
          lib_sec=$(python3 -c "print($t1 - $t0)")

          t2=$(python3 -c 'import time; print(time.monotonic())')
          cargo test --locked --test rust_correctness
          t3=$(python3 -c 'import time; print(time.monotonic())')
          corr_sec=$(python3 -c "print($t3 - $t2)")

          COMMIT_SHA=$(git rev-parse --short HEAD)
          SCCACHE_VER=$(./target/debug/sccache --version)
          RUSTC_VER=$(rustc --version)
          CARGO_VER=$(cargo --version)

          python3 - <<PY
          import json, os
          from pathlib import Path

          report = {
              "title": "sccache-rust-correctness",
              "commit_sha": "$COMMIT_SHA",
              "sccache_version": "$SCCACHE_VER",
              "rustc_version": "$RUSTC_VER",
              "cargo_version": "$CARGO_VER",
              "backend": "local-disk",
              "fixture": "unit + tests/rust_correctness.rs",
              "status": "PASS",
              "suites": [
                  {"name": "cargo test --locked --lib", "status": "PASS", "elapsed_sec": round($lib_sec, 2)},
                  {"name": "cargo test --locked --test rust_correctness", "status": "PASS", "elapsed_sec": round($corr_sec, 2)},
              ],
          }
          Path("target/regression-reports/correctness/report.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              lines = [
                  "## sccache-rust-correctness — PASS",
                  "",
                  "| Field | Value |",
                  "|---|---|",
                  "| Commit SHA | `$COMMIT_SHA` |",
                  "| sccache | `$SCCACHE_VER` |",
                  "| rustc | `$RUSTC_VER` |",
                  "| cargo | `$CARGO_VER` |",
                  "| Unit tests (`--lib`) | PASS ({:.2}s) |".format($lib_sec),
                  "| Correctness suite (`rust_correctness`) | PASS ({:.2}s) |".format($corr_sec),
                  "",
              ]
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines))
          PY

      - name: Upload correctness report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-rust-correctness-report
          path: target/regression-reports/correctness/
          retention-days: 14
          if-no-files-found: ignore

  sccache-disk-regression:
    name: sccache-disk-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Build sccache binary
        run: cargo build --locked --bin sccache

      - name: Run Cargo integration tests (sccache_cargo)
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: ""
        run: cargo test --locked --test sccache_cargo

      - name: Run Disk L0 Cold/Warm/Cross-root verification
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/disk
        run: bash tests/integration/scripts/test-disk-regression.sh

      - name: Upload Disk regression report and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-disk-regression-report
          path: target/regression-reports/disk/
          retention-days: 14
          if-no-files-found: ignore

  sccache-s3-regression:
    name: sccache-s3-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Build sccache binary
        run: cargo build --locked --bin sccache

      - name: Run L0 + S3 (Silo) multilevel regression (S01..S10)
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/s3
        run: bash tests/integration/scripts/test-s3-multilevel-regression.sh

      - name: Upload S3 regression report and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-s3-regression-report
          path: target/regression-reports/s3/
          retention-days: 14
          if-no-files-found: ignore

  build-sccache-for-regression:
    name: build-sccache-for-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Build sccache binary once for downstream suites
        run: cargo build --locked --bin sccache

      - name: Upload pre-built sccache binary
        uses: actions/upload-artifact@v7
        with:
          name: sccache-prebuilt-linux
          path: target/debug/sccache
          retention-days: 5

  ghac-seed:
    name: ghac-seed
    needs: [build-sccache-for-regression]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Download pre-built sccache binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-prebuilt-linux
          path: target/debug/

      - name: Export GHAC runtime environment
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[key]) {
                core.exportVariable(key, process.env[key]);
              }
            }
            const v2 = process.env.ACTIONS_CACHE_SERVICE_V2 || (process.env.ACTIONS_RESULTS_URL ? 'true' : '');
            if (v2) {
              core.exportVariable('ACTIONS_CACHE_SERVICE_V2', v2);
            }

      - name: Seed GHAC cache from Job A (slot-a)
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_GHA_VERSION: reg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/ghac-seed
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-ghac-regression.sh \
            --role seed \
            --meta-file "$REPORT_DIR/seed-meta.json"

      - name: Upload GHAC seed metadata and sanitized report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-ghac-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/ghac-seed/
          retention-days: 5
          if-no-files-found: ignore

  sccache-ghac-regression:
    name: sccache-ghac-regression
    needs: [build-sccache-for-regression, ghac-seed]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Download pre-built sccache binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-prebuilt-linux
          path: target/debug/

      - name: Download GHAC seed metadata (never L0 or target)
        uses: actions/download-artifact@v8
        with:
          name: sccache-ghac-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-reports/ghac-seed/

      - name: Export GHAC runtime environment
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[key]) {
                core.exportVariable(key, process.env[key]);
              }
            }
            const v2 = process.env.ACTIONS_CACHE_SERVICE_V2 || (process.env.ACTIONS_RESULTS_URL ? 'true' : '');
            if (v2) {
              core.exportVariable('ACTIONS_CACHE_SERVICE_V2', v2);
            }

      - name: Verify cross-job cross-root GHAC reuse & L0 backfill (Job B, slot-b)
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_GHA_VERSION: reg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/ghac
        run: |
          mkdir -p "$REPORT_DIR"
          chmod +x "$SCCACHE_BIN"
          cp target/regression-reports/ghac-seed/leg_ghac_seed.json "$REPORT_DIR/" 2>/dev/null || true
          bash tests/integration/scripts/test-ghac-regression.sh \
            --role verify \
            --meta-file target/regression-reports/ghac-seed/seed-meta.json

      - name: Upload GHAC regression report and sanitized logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-ghac-regression-report
          path: target/regression-reports/ghac/
          retention-days: 14
          if-no-files-found: ignore

  rust-compatibility-matrix:
    name: rust-compat-${{ matrix.toolchain }}
    needs: [build-sccache-for-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            alt: "1.91.0"
          - toolchain: beta
            alt: stable
          - toolchain: "1.91.0"
            alt: stable
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install target Rust toolchain (${{ matrix.toolchain }})
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install alternate Rust toolchain (${{ matrix.alt }}) for compiler isolation check
        run: rustup toolchain install --profile minimal --no-self-update "${{ matrix.alt }}"

      - name: Download pre-built sccache binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-prebuilt-linux
          path: target/debug/

      - name: Run compatibility regression against ${{ matrix.toolchain }}
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/compat-${{ matrix.toolchain }}
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-rust-compatibility.sh \
            --toolchain "${{ matrix.toolchain }}" \
            --alt-toolchain "${{ matrix.alt }}"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-rust-compat-${{ matrix.toolchain }}-report
          path: target/regression-reports/compat-${{ matrix.toolchain }}/
          retention-days: 14
          if-no-files-found: ignore

  rust-compatibility-nightly:
    name: sccache-rust-compatibility-nightly
    needs: [build-sccache-for-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly

      - name: Install Rust stable for compiler isolation check
        run: rustup toolchain install --profile minimal --no-self-update stable

      - name: Download pre-built sccache binary
        uses: actions/download-artifact@v8
        with:
          name: sccache-prebuilt-linux
          path: target/debug/

      - name: Run non-blocking compatibility check against nightly
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/compat-nightly
        run: |
          chmod +x "$SCCACHE_BIN"
          bash tests/integration/scripts/test-rust-compatibility.sh \
            --toolchain nightly \
            --alt-toolchain stable

      - name: Upload nightly compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-rust-compat-nightly-report
          path: target/regression-reports/compat-nightly/
          retention-days: 14
          if-no-files-found: ignore

  sccache-rust-compatibility:
    name: sccache-rust-compatibility
    needs: [rust-compatibility-matrix, rust-compatibility-nightly]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce blocking Rust compatibility checks
        env:
          MATRIX_RESULT: ${{ needs.rust-compatibility-matrix.result }}
          NIGHTLY_RESULT: ${{ needs.rust-compatibility-nightly.result }}
        run: |
          set -euo pipefail
          {
            echo "## sccache Rust Compatibility Matrix"
            echo ""
            echo "| Suite | Result | Blocking |"
            echo "|---|---|---|"
            echo "| \`stable\`, \`beta\`, \`1.91.0\` | \`${MATRIX_RESULT}\` | Yes |"
            echo "| \`nightly\` (\`sccache-rust-compatibility-nightly\`) | \`${NIGHTLY_RESULT}\` | No |"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          [ "$MATRIX_RESULT" = "success" ] || {
            echo "ERROR: blocking Rust compatibility matrix failed ($MATRIX_RESULT)" >&2
            exit 1
          }

  sccache-performance:
    name: sccache-performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Build sccache binary
        run: cargo build --locked --bin sccache

      - name: Run tokio-small and tokio-medium performance regression
        env:
          SCCACHE_BIN: ${{ github.workspace }}/target/debug/sccache
          REPORT_DIR: ${{ github.workspace }}/target/regression-reports/performance
        run: bash tests/integration/scripts/test-performance-regression.sh

      - name: Upload performance report and sanitized logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-performance-report
          path: target/regression-reports/performance/
          retention-days: 14
          if-no-files-found: ignore
